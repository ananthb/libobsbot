[workspace]
resolver = "2"
members = ["crates/libobsbot-core", "crates/libobsbot-ffi"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-only"
repository = "https://github.com/ananthb/libobsbot"
authors = ["Ananth Bhaskararaman <antsub@gmail.com>"]
description = "Cross-platform Rust SDK for OBSBOT cameras"

[workspace.dependencies]
libobsbot-core = { version = "0.0.0", path = "crates/libobsbot-core" }

thiserror = "2"
tracing = "0.1"
crossbeam-channel = "0.5"
arrayvec = "0.7"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
